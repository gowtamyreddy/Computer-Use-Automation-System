[project]
name = "cua"
version = "0.1.0"
description = "Computer-use discovery -> capability artifact -> deterministic replay, for legacy back-office apps"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "pydantic>=2.6",
  "openai>=1.40",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cua = "cua.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cua", "cua.surface", "target_app"]

[tool.setuptools.package-data]
cua = ["surface/perceive.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
